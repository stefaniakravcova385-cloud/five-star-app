<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Five Star — скачать приложение</title>
<style>
  :root {
    --red: #df2001;
    --red-dark: #a81701;
    --cream: #fff4e6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, var(--red) 0%, var(--red-dark) 100%);
    min-height: 100vh;
    min-height: 100dvh;
    position: relative;
    overflow-x: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 24px) 20px env(safe-area-inset-bottom, 24px);
    color: #fff;
  }
  .bg-icons {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .bg-icons img {
    position: absolute;
    filter: brightness(0.6) saturate(3);
    opacity: 0.3;
    mix-blend-mode: multiply;
  }
  .ic1 { width: 180px; top: 4%; left: -40px; transform: rotate(-12deg); }
  .ic2 { width: 130px; top: 10%; right: -20px; transform: rotate(18deg); }
  .ic3 { width: 220px; bottom: 6%; left: -50px; transform: rotate(8deg); }
  .ic4 { width: 90px; top: 42%; left: 6%; transform: rotate(-20deg); }
  .ic5 { width: 160px; bottom: -10px; right: -30px; transform: rotate(-15deg); }
  .ic6 { width: 70px; top: 60%; right: 10%; transform: rotate(25deg); }
  .ic7 { width: 150px; top: -30px; left: 30%; transform: rotate(5deg); }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .logo {
    width: 84px;
    height: 84px;
    margin: 0 auto 18px;
    border-radius: 50%;
    display: block;
    object-fit: contain;
  }
  h1 {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
    margin: 0 0 6px;
    text-transform: uppercase;
  }
  p.sub {
    margin: 0 0 32px;
    color: var(--cream);
    font-size: 15px;
    opacity: 0.9;
  }
  .buttons {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  a.store-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #fff;
    color: #1a1a1a;
    text-decoration: none;
    padding: 14px 18px;
    border-radius: 14px;
    font-weight: 600;
    font-size: 16px;
    transition: transform 0.15s ease;
    box-shadow: 0 6px 18px rgba(0,0,0,0.18);
  }
  a.store-btn:active { transform: scale(0.97); }
  .icon {
    width: 32px;
    height: 32px;
    flex-shrink: 0;
    object-fit: contain;
  }
  .label-group { text-align: left; line-height: 1.2; flex: 1; }
  .label-small { font-size: 11px; color: #777; display: block; }
  .label-big { font-size: 17px; font-weight: 700; display: block; }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--cream);
    opacity: 0.7;
    position: relative;
    z-index: 1;
  }
</style>
</head>
